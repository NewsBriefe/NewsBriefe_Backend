[project]
name = "newsbrief"
version = "1.0.0"
description = "NewsBrief API — AI-summarised multilingual news"
requires-python = ">=3.11"

dependencies = [
    # ── Web framework ──────────────────────────────────────
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "python-multipart==0.0.12",

    # ── Database ───────────────────────────────────────────
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",

    # ── Cache & task queue ─────────────────────────────────
    "redis[hiredis]==5.2.0",
    "celery[redis]==5.4.0",
    "celery-redbeat==2.2.0",

    # ── AI providers ───────────────────────────────────────
    "anthropic==0.49.0",
    "boto3==1.38.0",                # AWS Bedrock (DeepSeek R1)

    # ── Semantic similarity for dedup ───────────────────────
    # fastembed runs on ONNX Runtime, not PyTorch — same embedding
    # quality as sentence-transformers at a fraction of the install
    # size and no CUDA bloat. Used only for title-similarity dedup.
    "fastembed==0.3.6",

    # ── Translation ────────────────────────────────────────
    "deepl==1.19.1",
    "httpx==0.28.0",

    # ── News ingestion ─────────────────────────────────────
    "feedparser==6.0.11",
    "newsapi-python==0.2.7",

    # ── NLP ──────────────────────────────────────────────────
    "langdetect==1.0.9",
    # NOTE: scikit-learn removed — TF-IDF dedup was replaced with
    # URL+hash dedup (ingestion) and Jaccard+embedding dedup (tasks)
    # to fix OOM on memory-constrained workers. numpy stays since
    # fastembed depends on it transitively.
    "numpy<2",

    # ── Config & validation ────────────────────────────────
    "pydantic==2.10.2",
    "pydantic-settings==2.6.1",
    "python-dotenv==1.0.1",

    # ── API utilities ──────────────────────────────────────
    "slowapi==0.1.9",

    # ── Observability ──────────────────────────────────────
    "structlog==24.4.0",
    "sentry-sdk[fastapi]==2.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "httpx==0.28.0",
    "factory-boy==3.3.1",
    "ruff==0.8.1",
    "mypy==1.13.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
