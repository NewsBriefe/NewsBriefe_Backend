# NewsBrief — Fly.io Worker Configuration
# Runs Celery worker + beat (news fetcher + scheduler)
# Deploy with: fly deploy

app = "newsbrief-worker"
primary_region = "iad"   # Change to closest: iad=US-East, lax=US-West, lhr=London, fra=Frankfurt, sin=Singapore, syd=Sydney

[build]
  dockerfile = "Dockerfile"

[env]
  SERVICE     = "worker"
  DOCKER      = "true"
  ENVIRONMENT = "production"
  PORT        = "8000"

# Secrets (set via CLI — never put real values here):
# fly secrets set DATABASE_URL="..." REDIS_URL="..." etc.

[[vm]]
  size   = "shared-cpu-1x"   # Free tier — 1 shared vCPU
  memory = "512mb"            # Free tier — 256MB RAM

# Health check — uses the tiny HTTP server in start_worker.sh
[http_service]
  internal_port        = 8000
  force_https          = false
  auto_stop_machines   = "off"   # Never sleep — worker must run 24/7
  auto_start_machines  = true
  min_machines_running = 1       # Always keep 1 instance alive

  [[http_service.checks]]
    grace_period = "30s"         # Give beat + worker time to start
    interval     = "60s"
    method       = "GET"
    path         = "/"
    timeout      = "10s"
